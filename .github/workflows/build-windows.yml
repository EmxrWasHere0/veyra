name: Build Veyra Installer - Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "installers/main/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r installers/windows/requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name VeyraInstaller `
            --add-data "installers/windows/veyra-installer/veyra.png;." `
            installers/windows/veyra-installer/app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeyraInstaller-Windows
          path: dist/VeyraInstaller.exe
          if-no-files-found: error
