name: Build Veyra Installer - macOS

on:
  workflow_dispatch:
  push:
    paths:
      - "installers/main/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r installers/main/requirements.txt

      - name: Build macOS executable
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name VeyraInstaller \
            --add-data "installers/main/veyra-installer/veyra.png:." \
            installers/main/veyra-installer/app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeyraInstaller-macOS
          path: dist/VeyraInstaller
          if-no-files-found: error
