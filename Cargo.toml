[package]
name = "veyra"
version = "0.2.8"
edition = "2021"

[package.metadata.veyra]
codename = "Jay"
devname = "J1"

[dependencies]
serde_json = "1"

reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls-webpki-roots"
] }

tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots"
] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.8"
